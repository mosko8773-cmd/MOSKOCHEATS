<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MOSKO — تسجيل الدخول وتفعيل Happ</title>
  <meta name="description" content="أدخل مفتاح MOSKO وأضف الاشتراك إلى تطبيق Happ بضغطة." />
  <meta name="theme-color" content="#0a120e" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="orb orb-top" aria-hidden="true"></div>
    <div class="orb orb-bottom" aria-hidden="true"></div>
    <div class="scan" aria-hidden="true"></div>

    <section class="wrap float-in">
      <header class="head">
        <div class="logo">
          <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></svg>
        </div>
        <h1 class="brand" dir="ltr">MOSKO</h1>
        <p class="subtitle" id="subtitle">سجّل دخولك بمفتاحك لتفعيل الاشتراك</p>
      </header>

      <div class="card glass">
        <!-- Login -->
        <form id="login" class="stack" novalidate>
          <label class="field">
            <span class="label">مفتاح التفعيل</span>
            <div class="input-wrap">
              <svg class="input-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.59 18.59A2 2 0 0 0 2 20v2h4v-2h2v-2h2l1.41-1.41a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r=".5" fill="currentColor"/></svg>
              <input id="key" dir="ltr" placeholder="MOSKO-XXXXX-XXXXX-XXXXX-XXXXX" autocomplete="off" spellcheck="false" />
            </div>
          </label>
          <p id="error" class="error" hidden></p>
          <button id="submit" type="submit" class="btn btn-neon btn-xl">
            <span class="spinner" hidden></span>
            <span class="btn-text">دخول</span>
          </button>
          <p class="hint">لم تشترِ مفتاحاً بعد؟ اشترِ واحداً من بوت MOSKO ثم عُد إلى هنا.</p>
        </form>

        <!-- Dashboard -->
        <div id="dashboard" class="stack" hidden>
          <div class="row">
            <span class="badge"><span class="dot"></span>فعّال</span>
            <span id="dash-key" class="mono small muted" dir="ltr"></span>
          </div>
          <div class="grid2">
            <div class="stat">
              <div class="stat-label">الباقة</div>
              <div id="plan" class="stat-value" dir="auto">—</div>
            </div>
            <div class="stat">
              <div class="stat-label">الوقت المتبقي</div>
              <div id="remaining" class="stat-value" dir="auto">—</div>
            </div>
          </div>
          <button id="add" type="button" class="btn btn-neon btn-lg no-select">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            Add subscription
          </button>
          <ol class="steps">
            <li><span class="num">1.</span> تأكد أن تطبيق Happ مثبّت على جهازك.</li>
            <li><span class="num">2.</span> اضغط زر Add subscription أعلاه — سيفتح Happ ويضيف الاشتراك.</li>
            <li><span class="num">3.</span> اضغط اتصال — يتحدث الاشتراك تلقائياً.</li>
          </ol>
          <div class="row footer">
            <button id="refresh" type="button" class="btn btn-ghost btn-sm">توليد رابط جديد</button>
            <button id="logout" type="button" class="btn btn-ghost btn-sm">خروج</button>
          </div>
        </div>
      </div>
    </section>
  </main>
  <div id="toast" class="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
