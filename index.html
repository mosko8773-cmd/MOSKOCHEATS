<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة إنشاء الأكواد - moskoalostora</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
      width: 350px;
    }
    h2 { margin-bottom: 20px; color: #333; }
    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      transition: 0.3s;
    }
    button:hover { background-color: #45a049; }
    #result {
      margin-top: 20px;
      font-weight: bold;
      font-size: 18px;
      word-break: break-all;
    }
    .success { color: #2e7d32; }
    .error { color: #d32f2f; }
  </style>
</head>
<body>

  <div class="card">
    <h2>مولد أكواد التطبيق</h2>
    <button id="generateBtn" onclick="generateAndSaveCode()">إنشاء كود جديد</button>
    <p id="result"></p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>
